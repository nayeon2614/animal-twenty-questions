<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 동물 스무고개</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:"Noto Sans KR",Arial,sans-serif;
    background:linear-gradient(135deg,#e9f8e9,#eaf3ff);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#333;
}
.game{
    width:100%;
    max-width:680px;
    background:white;
    border-radius:28px;
    padding:28px;
    box-shadow:0 15px 45px rgba(50,90,60,.15);
}
h1{
    text-align:center;
    margin:0;
    font-size:30px;
}
.subtitle{
    text-align:center;
    color:#777;
    margin:8px 0 20px;
}
.animal-icon{
    text-align:center;
    font-size:64px;
    margin-bottom:12px;
}
.status{
    display:flex;
    justify-content:space-between;
    background:#f0f8f0;
    border-radius:14px;
    padding:13px 16px;
    margin-bottom:15px;
    font-size:14px;
}
.status strong{
    color:#4c9b58;
}
.chat{
    height:350px;
    overflow-y:auto;
    background:#fafafa;
    border:1px solid #eee;
    border-radius:18px;
    padding:15px;
    margin-bottom:14px;
}
.message{
    max-width:90%;
    padding:11px 14px;
    border-radius:16px;
    margin:9px 0;
    line-height:1.6;
    word-break:keep-all;
}
.bot{
    background:#e9f7e9;
    margin-right:auto;
}
.user{
    background:#e7f1ff;
    margin-left:auto;
    text-align:right;
}
.row{
    display:flex;
    gap:8px;
}
input{
    flex:1;
    min-width:0;
    padding:13px;
    border:2px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:14px;
}
input:focus{
    border-color:#69ad72;
}
button{
    border:0;
    border-radius:12px;
    padding:12px 16px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}
.ask{
    background:#62ad6b;
    color:white;
}
.guess{
    width:100%;
    margin-top:9px;
    background:#ffb54a;
    color:white;
}
.restart{
    width:100%;
    margin-top:14px;
    background:#333;
    color:white;
}
.result{
    display:none;
    text-align:center;
    padding:14px;
    border-radius:14px;
    margin-top:12px;
    font-size:20px;
    font-weight:bold;
}
.success{
    background:#fff3ae;
    color:#d28b00;
}
.fail{
    background:#ffe4e4;
    color:#d25b5b;
}
.tip{
    text-align:center;
    color:#999;
    font-size:12px;
    margin-top:8px;
}
@media(max-width:520px){
    .game{padding:20px}
    .row{flex-direction:column}
    .ask{width:100%}
}
</style>
</head>
<body>
<div class="game">
<h1>🐾 동물 스무고개</h1>
<div class="subtitle">
내가 생각한 동물을 질문으로 맞혀봐!
</div>
<div class="animal-icon">🤔</div>
<div class="status">
<span>질문 <strong><span id="qCount">0</span> / 20</strong></span>
<span>정답 <strong><span id="gCount">0</span> / 3</strong></span>
</div>
<div class="chat" id="chat">
<div class="message bot">
안녕! 🐾<br><br>
내가 동물 하나를 생각했어!<br>
나에게 <strong>예 / 아니오</strong>로 대답할 수 있는 질문을 해봐.<br><br>
질문은 최대 <strong>20번</strong>,<br>
정답을 말할 기회는 <strong>3번</strong>이야! 🔎
</div>
</div>
<div class="row">
<input
id="questionInput"
placeholder="예: 육지에서 살아?"
>
<button class="ask" onclick="askQuestion()">
질문하기
</button>
</div>
<div class="tip">
💡 서식지, 크기, 먹이, 외형, 행동, 사람과의 관계 등을 물어봐!
</div>
<div class="row" style="margin-top:12px">
<input
id="guessInput"
placeholder="정답이라고 생각하는 동물 이름"
>
</div>
<button class="guess" onclick="guessAnimal()">
🎯 정답 말하기
</button>
<div id="result" class="result"></div>
<button class="restart" onclick="restartGame()">
🔄 새 게임
</button>
</div>

/* ============================================================
   게임 상태
   ============================================================ */
let secretAnimal =
animals[Math.floor(Math.random()*animals.length)];
let questionCount=0;
let guessCount=0;
let gameOver=false;
/* ============================================================
   질문 처리
   ============================================================ */
function askQuestion(){
if(gameOver)return;
if(questionCount>=20){
addMessage("질문 20번을 모두 사용했어! 😮 이제 정답을 말해봐!","bot");
return;
}
const input=document.getElementById("questionInput");
const question=input.value.trim();
if(!question){
alert("질문을 입력해줘!");
return;
}
addMessage(question,"user");
questionCount++;
document.getElementById("qCount").textContent=questionCount;
const answer=findAnswer(question);
if(answer===null){
addMessage(
"음... 🤔 그 질문은 내가 준비한 특징에는 없네!<br>"+
"다른 특징을 질문해 봐. 예를 들면 <strong>육지, 물, 크기, 털, 먹이, 사람과의 관계</strong> 같은 걸 물어볼 수 있어!",
"bot"
);
}else{
addMessage(
answer ? "예! 😊" : "아니오! 🙅",
"bot"
);
}
input.value="";
input.focus();
if(questionCount===20){
addMessage(
"질문 20번을 모두 사용했어! 🔎<br>"+
"이제 정답을 말해봐!",
"bot"
);
}
}
/* ============================================================
   질문 분석
   ============================================================ */
function findAnswer(question){
for(const rule of rules){
for(const key of rule.keys){
if(question.includes(key)){
return rule.check(secretAnimal.features);
}
}
}
return null;
}
/* ============================================================
   정답
   ============================================================ */
function guessAnimal(){
if(gameOver)return;
if(guessCount>=3){
addMessage("정답 기회를 모두 사용했어!","bot");
return;
}
const input=document.getElementById("guessInput");
const guess=input.value.trim();
if(!guess){
alert("동물 이름을 입력해줘!");
return;
}
guessCount++;
document.getElementById("gCount").textContent=guessCount;
addMessage("🎯 "+guess+"!","user");
input.value="";
if(guess===secretAnimal.name){
gameOver=true;
addMessage(
"🎉 정답이야!<br>"+
"내가 생각한 동물은 "+
secretAnimal.emoji+
" <strong>"+secretAnimal.name+"</strong>이었어!",
"bot"
);
showResult("🎉 축하합니다!! 🎉","success");
fanfare();
return;
}
addMessage("🥲 아쉽지만 정답이 아니야!","bot");
showResult("다시 도전하세요🥲","fail");
if(guessCount===3){
gameOver=true;
addMessage(
"정답 기회를 모두 사용했어! 🥹<br>"+
"정답은 "+
secretAnimal.emoji+
" <strong>"+secretAnimal.name+"</strong>이었어!",
"bot"
);
showResult("다시 도전하세요🥹","fail");
}
}
/* ============================================================
   메시지
   ============================================================ */
function addMessage(text,type){
const chat=document.getElementById("chat");
const div=document.createElement("div");
div.className="message "+type;
div.innerHTML=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}
/* ============================================================
   결과
   ============================================================ */
function showResult(text,type){
const result=document.getElementById("result");
result.textContent=text;
result.className="result "+type;
result.style.display="block";
}
/* ============================================================
   팡파레
   ============================================================ */
function fanfare(){
const colors=[
"#ff6b6b",
"#ffd93d",
"#6bcB77",
"#4d96ff",
"#c77dff",
"#ff9f1c"
];
for(let i=0;i<120;i++){
const piece=document.createElement("div");
piece.style.position="fixed";
piece.style.top="-20px";
piece.style.left=Math.random()*100+"vw";
piece.style.width=6+Math.random()*8+"px";
piece.style.height=6+Math.random()*8+"px";
piece.style.background=
colors[Math.floor(Math.random()*colors.length)];
piece.style.zIndex="9999";
piece.style.animation=
"fall 2.8s linear forwards";
document.body.appendChild(piece);
setTimeout(()=>piece.remove(),3500);
}
}
const style=document.createElement("style");
style.innerHTML=`
@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
opacity:0;
}
}`;
document.head.appendChild(style);
/* ============================================================
   엔터키
   ============================================================ */
document.getElementById("questionInput")
.addEventListener("keydown",function(e){
if(e.key==="Enter"){
askQuestion();
}
});
document.getElementById("guessInput")
.addEventListener("keydown",function(e){
if(e.key==="Enter"){
guessAnimal();
}
});
/* ============================================================
   새 게임
   ============================================================ */
function restartGame(){
secretAnimal=
animals[Math.floor(Math.random()*animals.length)];
questionCount=0;
guessCount=0;
gameOver=false;
document.getElementById("qCount").textContent="0";
document.getElementById("gCount").textContent="0";
document.getElementById("result").style.display="none";
document.getElementById("questionInput").value="";
document.getElementById("guessInput").value="";
document.getElementById("chat").innerHTML=`
<div class="message bot">
새로운 동물을 골랐어! 🐾<br><br>
이번에는 어떤 동물일까?<br>
질문을 최대 20번까지 해봐! 🔎<br><br>
정답을 말할 기회는 3번이야!
</div>
`;
document.getElementById("questionInput").focus();
}
</script>
